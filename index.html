<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fohg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14161a;
    --navy:#16223d;
    --navy-700:#1f3057;
    --navy-50:#eef1f7;
    --paper:#ffffff;
    --paper-2:#fafbfc;
    --line:#e7e9ee;
    --muted:#5b6472;
    --shadow:0 1px 2px rgba(20,22,26,.04), 0 8px 24px rgba(20,22,26,.06);
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Zen Kaku Gothic New",-apple-system,sans-serif;
    color:var(--ink); background:var(--paper);
    -webkit-font-smoothing:antialiased; line-height:1.7;
    word-break:keep-all; overflow-wrap:anywhere; line-break:strict;
  }
  .mincho{font-family:"Shippori Mincho",serif;}
  a{color:inherit}
  button{font-family:inherit; cursor:pointer}

  header.site{
    position:sticky; top:0; z-index:40;
    background:rgba(255,255,255,.86); backdrop-filter:saturate(160%) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .bar{max-width:1080px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:10px}
  .wordmark{font-family:"Shippori Mincho",serif; font-weight:700; font-size:32px; color:var(--navy); text-decoration:none; position:relative; display:inline-block}
  .wordmark .name{letter-spacing:.22em; padding-right:.05em}
  .wordmark::after{content:""; position:absolute; left:0; right:.14em; bottom:-5px; height:1.5px;
    background:linear-gradient(90deg,var(--navy) 0%,var(--navy) 62%,transparent 100%); opacity:.55}
  .wordmark:hover::after{opacity:.9}
  .bar .spacer{flex:1}
  .nav-btn{font-size:12.5px; color:var(--muted); background:none; border:1px solid var(--line); padding:6px 12px; border-radius:999px; white-space:nowrap}
  .nav-btn:hover{border-color:var(--navy); color:var(--navy)}
  .nav-btn.primary{background:var(--navy); color:#fff; border-color:var(--navy)}
  .nav-btn.primary:hover{background:var(--navy-700)}
  @media(max-width:560px){
    .bar{gap:7px}
    .nav-btn{font-size:11.5px; padding:5px 9px}
    .wordmark{font-size:26px}
  }

  .hero{max-width:1080px; margin:0 auto; padding:46px 20px 24px}
  .hero h1{font-family:"Shippori Mincho",serif; font-weight:600; font-size:clamp(24px,4.4vw,38px); line-height:1.5; margin:0 0 12px; letter-spacing:.06em}
  .hero h1 .phrase{display:inline-block}
  .nobr{white-space:nowrap}
  .hero p{margin:0; color:var(--muted); font-size:15px; max-width:46em}
  .visits{margin-top:14px; font-size:12.5px; color:var(--muted); letter-spacing:.02em}
  .visits b{font-weight:700; color:var(--navy)}

  .controls{max-width:1080px; margin:0 auto; padding:18px 20px 8px}
  .search{position:relative}
  .search input{
    width:100%; padding:14px 16px 14px 44px; font-size:15px; color:var(--ink);
    border:1px solid var(--line); border-radius:var(--radius); background:var(--paper-2);
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .search input:focus{border-color:var(--navy); box-shadow:0 0 0 3px var(--navy-50); background:#fff}
  .search svg{position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--muted)}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
  .chip{
    font-size:13px; padding:7px 14px; border-radius:999px; border:1px solid var(--line);
    background:#fff; color:var(--muted); transition:all .15s;
  }
  .chip:hover{border-color:var(--navy); color:var(--navy)}
  .chip.active{background:var(--navy); color:#fff; border-color:var(--navy)}

  .grid{max-width:1080px; margin:0 auto; padding:22px 20px 40px;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:18px}
  .card{
    border:1px solid var(--line); border-radius:var(--radius); background:#fff;
    overflow:hidden; display:flex; flex-direction:column;
    transition:transform .18s, box-shadow .18s, border-color .18s;
  }
  .card:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:#d7dbe4}
  .thumb{aspect-ratio:16/9; background:var(--navy); position:relative; overflow:hidden; cursor:pointer}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .thumb .mono{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:"Shippori Mincho",serif; font-size:34px; letter-spacing:.08em;
    background:linear-gradient(135deg,#16223d 0%,#27375f 100%)}
  .thumb .mono::after{content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 8px)}
  .card .body{padding:16px 16px 8px; flex:1; cursor:pointer}
  .cat{display:inline-block; font-size:11.5px; letter-spacing:.06em; color:var(--navy);
    background:var(--navy-50); padding:3px 9px; border-radius:999px; margin-bottom:9px}
  .card h3{margin:0 0 6px; font-size:16.5px; font-weight:700; line-height:1.45}
  .card .sum{margin:0; font-size:13.5px; color:var(--muted);
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
  .card .foot{display:flex; gap:8px; padding:12px 16px 16px}
  .btn{flex:1; text-align:center; text-decoration:none; font-size:13.5px; font-weight:500;
    padding:11px 10px; border-radius:9px; border:1px solid var(--navy); transition:all .15s; white-space:nowrap}
  .btn.primary{background:var(--navy); color:#fff}
  .btn.primary:hover{background:var(--navy-700)}
  .btn.ghost{background:#fff; color:var(--navy)}
  .btn.ghost:hover{background:var(--navy-50)}
  .btn[disabled],.btn.dis{opacity:.35; pointer-events:none; border-color:var(--line); color:var(--muted)}

  .stats{display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:0 16px 14px; font-size:12px; color:var(--muted)}
  .stats .dot{opacity:.4}
  .stats b{font-weight:600; color:#3a4555}

  .empty{max-width:1080px; margin:0 auto; padding:60px 20px; text-align:center; color:var(--muted)}

  .paid-wrap{max-width:1080px; margin:0 auto; padding:0 20px 72px; display:none}
  .paid-wrap.show{display:block}
  .paid-banner{display:flex; align-items:center; gap:20px; padding:22px 24px;
    background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius);
    transition:border-color .18s, box-shadow .18s}
  .paid-banner:hover{border-color:#d7dbe4; box-shadow:var(--shadow)}
  .paid-banner .mark{flex:0 0 auto; width:44px; height:44px; border-radius:11px;
    background:var(--navy-50); display:grid; place-items:center}
  .paid-banner .mark svg{display:block}
  .paid-banner .pb-body{flex:1; min-width:0}
  .paid-banner .eyebrow{margin:0 0 4px; font-size:11px; letter-spacing:.16em; color:var(--muted)}
  .paid-banner .pb-link{display:inline-flex; align-items:center; gap:9px;
    font-family:"Shippori Mincho",serif; font-size:18px; font-weight:600; color:var(--navy); text-decoration:none}
  .paid-banner .pb-link .label{
    background-image:linear-gradient(var(--navy),var(--navy));
    background-size:0% 1.5px; background-repeat:no-repeat; background-position:left 100%;
    transition:background-size .26s ease; padding-bottom:2px}
  .paid-banner .pb-link:hover .label,
  .paid-banner .pb-link:focus-visible .label{background-size:100% 1.5px}
  .paid-banner .pb-link .chev{flex:0 0 auto; transition:transform .22s ease}
  .paid-banner .pb-link:hover .chev,
  .paid-banner .pb-link:focus-visible .chev{transform:translateX(4px)}
  .paid-banner .pb-link:focus-visible{outline:2px solid var(--navy); outline-offset:4px; border-radius:6px}
  .paid-banner .note{margin:7px 0 0; font-size:12px; color:var(--muted)}
  @media(max-width:560px){
    .paid-banner{flex-direction:column; align-items:flex-start; gap:14px; padding:20px}
    .paid-banner .pb-link{font-size:17px}
  }
  @media(prefers-reduced-motion:reduce){
    .paid-banner .pb-link .chev,.paid-banner .pb-link .label{transition:none}
  }

  .overlay{position:fixed; inset:0; background:rgba(20,22,26,.45); backdrop-filter:blur(2px);
    display:none; align-items:flex-end; justify-content:center; z-index:60}
  .overlay.show{display:flex}
  .sheet{background:#fff; width:100%; max-width:680px; max-height:92vh; overflow:auto;
    border-radius:18px 18px 0 0; box-shadow:0 -8px 40px rgba(0,0,0,.18); animation:rise .22s ease}
  @media(min-width:720px){ .overlay{align-items:center} .sheet{border-radius:18px} }
  @keyframes rise{from{transform:translateY(24px); opacity:.6} to{transform:translateY(0); opacity:1}}
  .sheet .sheet-head{position:sticky; top:0; background:#fff; display:flex; align-items:center;
    gap:12px; padding:18px 22px; border-bottom:1px solid var(--line); z-index:2}
  .sheet .sheet-head .ttl{font-family:"Shippori Mincho",serif; font-size:19px; font-weight:600; flex:1}
  .x{border:none; background:var(--navy-50); width:34px; height:34px; border-radius:50%; color:var(--navy); font-size:16px}
  .sheet .pad{padding:22px}

  .detail .hero-img{aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:var(--navy); margin-bottom:16px}
  .detail .hero-img img{width:100%; height:100%; object-fit:cover}
  .detail .hero-img .mono{height:100%; display:flex; align-items:center; justify-content:center; color:#fff;
    font-family:"Shippori Mincho",serif; font-size:48px; background:linear-gradient(135deg,#16223d,#27375f)}
  .detail h2{font-family:"Shippori Mincho",serif; font-size:23px; margin:6px 0 8px}
  .detail .desc{white-space:pre-wrap; color:#2b3340; font-size:14.5px; margin:14px 0}
  .tags{display:flex; flex-wrap:wrap; gap:7px; margin:10px 0}
  .tag{font-size:12px; color:var(--muted); border:1px solid var(--line); padding:3px 10px; border-radius:999px}
  .meta{font-size:12px; color:var(--muted); margin-top:12px}
  .actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}
  .actions .btn{flex:1; min-width:140px; padding:14px}

  .field{margin-bottom:16px}
  .field label{display:block; font-size:13px; font-weight:500; margin-bottom:6px}
  .field label .req{color:#b4232a; font-size:11px; margin-left:4px}
  .field label .opt{color:var(--muted); font-size:11px; margin-left:4px}
  .field input[type=text],.field textarea{
    width:100%; padding:11px 13px; font-size:14.5px; font-family:inherit; color:var(--ink);
    border:1px solid var(--line); border-radius:9px; background:var(--paper-2); outline:none}
  .field input:focus,.field textarea:focus{border-color:var(--navy); box-shadow:0 0 0 3px var(--navy-50); background:#fff}
  .field textarea{min-height:90px; resize:vertical}
  .save-btn{width:100%; padding:15px; font-size:15px; font-weight:700; color:#fff; background:var(--navy); border:none; border-radius:11px}
  .save-btn:hover{background:var(--navy-700)}
  .save-btn[disabled]{opacity:.5; pointer-events:none}
  .hint{font-size:12px; color:var(--muted); margin-top:6px}
  .err{color:#b4232a; font-size:13px; margin-top:10px; min-height:18px}

  .kind-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  @media(min-width:520px){ .kind-grid{grid-template-columns:1fr 1fr 1fr} }
  .kind{border:1px solid var(--line); background:var(--paper-2); border-radius:11px; padding:12px 12px;
    text-align:left; transition:all .15s; line-height:1.4}
  .kind .k-emoji{font-size:18px}
  .kind .k-title{display:block; font-size:13.5px; font-weight:700; margin-top:4px; color:var(--ink)}
  .kind .k-sub{display:block; font-size:11px; color:var(--muted); margin-top:1px}
  .kind:hover{border-color:var(--navy)}
  .kind.active{border-color:var(--navy); background:var(--navy-50); box-shadow:0 0 0 2px var(--navy-50)}
  .thanks{text-align:center; padding:18px 6px}
  .thanks .ic{width:54px; height:54px; border-radius:50%; background:var(--navy-50); color:var(--navy);
    display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 14px}
  .thanks h3{font-family:"Shippori Mincho",serif; font-size:20px; margin:0 0 8px}
  .thanks p{color:var(--muted); font-size:14px; margin:0 0 20px}

  .loading{padding:40px; text-align:center; color:var(--muted)}
  .spinner{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--navy);border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="site">
  <div class="bar">
    <a class="wordmark" href="#" onclick="location.reload();return false;"><span class="name" id="wm">Fohg</span></a>
    <div class="spacer"></div>
    <button class="nav-btn primary" id="contactBtn" onclick="openContact()">ご要望・お問い合わせ</button>
  </div>
</header>

<section class="hero">
  <h1 id="tagline">読み込み中…</h1>
  <p>生成AIでつくった道具を、無料で集めた場所です。登録はいりません。気に入ったら、そのまま使ってください。</p>
  <p class="visits" id="visits" style="display:none"></p>
</section>

<div class="controls">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="text" placeholder="キーワードで探す（例：漢字、採点、週案…）" oninput="render()">
  </div>
  <div class="chips" id="chips"></div>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">該当する道具がありません。</div>

<!-- 常設バナー：パートナー運営の有料ページへ（PAID_URL を設定すると表示されます） -->
<div class="paid-wrap" id="paidWrap">
  <section class="paid-banner" aria-labelledby="paidLink">
    <div class="mark" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <path d="M3 17c4 0 5-4 10-4s6 4 10 4" stroke="#16223d" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M17 9l4 4-4 4" stroke="#16223d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="pb-body">
      <p class="eyebrow">FOHG をもっと使う</p>
      <a id="paidLink" class="pb-link" href="#" target="_blank" rel="noopener noreferrer">
        <span class="label">より使える親子向けの有料ツールはこちら</span>
        <svg class="chev" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M6 4l5 5-5 5" stroke="#16223d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <p class="note">外部サイトへ移動します</p>
    </div>
  </section>
</div>

<!-- 詳細モーダル -->
<div class="overlay" id="ovDetail" onclick="if(event.target===this)closeModal('ovDetail')">
  <div class="sheet detail">
    <div class="sheet-head"><div class="ttl">詳細</div><button class="x" onclick="closeModal('ovDetail')">✕</button></div>
    <div class="pad" id="detailBody"></div>
  </div>
</div>

<!-- コンタクト（誰でも送信OK） -->
<div class="overlay" id="ovContact" onclick="if(event.target===this)closeModal('ovContact')">
  <div class="sheet">
    <div class="sheet-head"><div class="ttl">管理者へのご連絡</div><button class="x" onclick="closeModal('ovContact')">✕</button></div>
    <div class="pad">
      <div id="contactForm">
        <p class="hint" style="margin:0 0 16px">「こんなツールが欲しい」「この業務をなくしたい」「相談したい」など、なんでもどうぞ。匿名でもかまいません。</p>
        <div class="field">
          <label>どんなご連絡ですか？<span class="req">必須</span></label>
          <div class="kind-grid" id="kindGrid"></div>
        </div>
        <div class="field">
          <label>内容<span class="req">必須</span></label>
          <textarea id="c_body" placeholder="例：テストの平均点を自動で出すシートが欲しいです。今は毎回手計算で大変で…" style="min-height:120px"></textarea>
        </div>
        <div class="field">
          <label>お名前<span class="opt">任意</span></label>
          <input id="c_name" type="text" placeholder="（未記入でも送れます）">
        </div>
        <div class="field">
          <label>連絡先<span class="opt">任意</span></label>
          <input id="c_contact" type="text" placeholder="返信が欲しい場合のみ：メール・内線・チャットなど">
          <div class="hint">こちらから返信が必要なときだけご記入ください。</div>
        </div>
        <button class="save-btn" id="contactSend" onclick="submitContact()">送信する</button>
        <div class="err" id="contactErr"></div>
      </div>
      <div id="contactThanks" class="thanks" style="display:none">
        <div class="ic">✓</div>
        <h3>送信しました</h3>
        <p>お知らせ、ありがとうございます。内容を確認します。</p>
        <button class="save-btn" onclick="closeModal('ovContact')">閉じる</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   GitHub Pages 版 Fohg
   - データの読み書きは GAS のウェブアプリ(/exec)へ fetch で問い合わせ
   - 下の GAS_URL に、あなたの「全員（匿名を含む）」デプロイの /exec を貼る
   ============================================================ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycby8OOUq__RjXR_vb2YZ4zkLzTpJkHCQOWdPhhmR09fcPVuKev7wget5x9bMlp6UYTBEcg/exec';   // 例：'https://script.google.com/macros/s/××××/exec'

/* GET: ?api=... を付けて JSON を取得 */
function apiGet(params){
  var url = GAS_URL + (GAS_URL.indexOf('?')>=0?'&':'?') + params;
  return fetch(url, {method:'GET'}).then(function(r){ return r.json(); });
}
/* POST: CORS回避のため text/plain で本文JSONを送る */
function apiPost(obj){
  return fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(obj)
  }).then(function(r){ return r.json(); });
}

var STATE={ items:[], categories:[], filter:'all', contactKind:'' };

var KINDS=[
  {key:'要望',    emoji:'💡', title:'こんなのが欲しい', sub:'新しいツール・機能'},
  {key:'困りごと', emoji:'😣', title:'困っている',       sub:'うまくいかない・不具合'},
  {key:'業務削減', emoji:'✂️', title:'なくしたい業務',   sub:'手間を減らしたい作業'},
  {key:'依頼',    emoji:'🤝', title:'お願いしたい',     sub:'相談・作成のご依頼'},
  {key:'その他',  emoji:'✉️', title:'その他',           sub:'感想・連絡など'}
];

/* ===== 初期化 ===== */
window.addEventListener('load', function(){
  buildKindGrid();
  if(!GAS_URL){
    document.getElementById('tagline').textContent='設定が未完了です（GAS_URL 未設定）。';
    return;
  }
  apiGet('api=init').then(function(d){
    document.getElementById('wm').textContent=d.siteName||'Fohg';
    document.title=d.siteName||'Fohg';
    document.getElementById('tagline').innerHTML=phraseWrap(d.siteTagline||'');
    STATE.categories=d.categories||[];
    STATE.items=d.items||[];
    buildChips(); render();
    renderPaidBanner(d.paidUrl);
    showVisits(d.visits);
    apiGet('api=bumpVisit').then(function(r){ showVisits(r.visits); }).catch(function(){});
  }).catch(function(e){
    document.getElementById('tagline').textContent='読み込みに失敗しました。再読み込みしてください。';
  });
});

function renderPaidBanner(url){
  url=String(url||'').trim();
  var wrap=document.getElementById('paidWrap');
  if(!wrap) return;
  if(!url){ wrap.classList.remove('show'); return; }
  document.getElementById('paidLink').setAttribute('href', url);
  wrap.classList.add('show');
}

function buildChips(){
  var box=document.getElementById('chips');
  var html='<button class="chip active" data-k="all" onclick="setFilter(\'all\',this)">すべて</button>';
  STATE.categories.forEach(function(c){
    html+='<button class="chip" data-k="'+esc(c.key)+'" onclick="setFilter(\''+esc(c.key)+'\',this)">'+esc(c.label)+'</button>';
  });
  box.innerHTML=html;
}
function setFilter(k,el){
  STATE.filter=k;
  document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active')});
  el.classList.add('active'); render();
}
function catLabel(key){ var c=STATE.categories.find(function(x){return x.key===key}); return c?c.label:key; }

/* ===== 一覧描画 ===== */
function render(){
  var q=(document.getElementById('q').value||'').toLowerCase().trim();
  var list=STATE.items.filter(function(it){
    if(STATE.filter!=='all' && it.category!==STATE.filter) return false;
    if(!q) return true;
    return (it.title+' '+it.summary+' '+it.tags+' '+it.description).toLowerCase().indexOf(q)>=0;
  });
  var grid=document.getElementById('grid'), empty=document.getElementById('empty');
  if(!list.length){ grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  grid.innerHTML=list.map(cardHtml).join('');
}
function cardStats(it){
  var bits=[];
  if(it.views)     bits.push('閲覧 <b>'+fmt(it.views)+'</b>');
  if(it.copies)    bits.push('コピー <b>'+fmt(it.copies)+'</b>');
  if(it.downloads) bits.push('DL <b>'+fmt(it.downloads)+'</b>');
  if(!bits.length) return '';
  return '<div class="stats">'+bits.join('<span class="dot">・</span>')+'</div>';
}
function cardHtml(it){
  var thumb = it.thumbnail
    ? '<div class="thumb" onclick="openDetail(\''+it.id+'\')"><img src="'+esc(it.thumbnail)+'" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML=\'<div class=\\\'mono\\\'>'+initial(it.title)+'</div>\'"></div>'
    : '<div class="thumb" onclick="openDetail(\''+it.id+'\')"><div class="mono">'+initial(it.title)+'</div></div>';
  var copyBtn = it.copyUrl
    ? '<a class="btn primary" href="'+esc(it.copyUrl)+'" target="_blank" rel="noopener" onclick="bump(\''+it.id+'\',\'copy\')">コピーを作成</a>'
    : '<span class="btn primary dis">コピー不可</span>';
  var dlBtn = it.downloadUrl
    ? '<a class="btn ghost" href="'+esc(it.downloadUrl)+'" target="_blank" rel="noopener" onclick="bump(\''+it.id+'\',\'download\')">ダウンロード</a>'
    : (it.externalUrl ? '<a class="btn ghost" href="'+esc(it.externalUrl)+'" target="_blank" rel="noopener">リンクを開く</a>' : '<span class="btn ghost dis">DLなし</span>');
  return '<div class="card">'+thumb+
    '<div class="body" onclick="openDetail(\''+it.id+'\')"><span class="cat">'+esc(catLabel(it.category))+'</span>'+
    '<h3>'+esc(it.title)+'</h3><p class="sum">'+esc(it.summary)+'</p></div>'+
    cardStats(it)+
    '<div class="foot">'+copyBtn+dlBtn+'</div></div>';
}

/* ===== 詳細 ===== */
function openDetail(id){
  var it=STATE.items.find(function(x){return x.id===id}); if(!it) return;
  bump(id,'view');
  var img = it.thumbnail
    ? '<div class="hero-img"><img src="'+esc(it.thumbnail)+'" referrerpolicy="no-referrer"></div>'
    : '<div class="hero-img"><div class="mono">'+initial(it.title)+'</div></div>';
  var tags = it.tags ? '<div class="tags">'+it.tags.split(',').map(function(t){t=t.trim();return t?'<span class="tag">'+esc(t)+'</span>':''}).join('')+'</div>' : '';
  var acts='';
  if(it.copyUrl) acts+='<a class="btn primary" href="'+esc(it.copyUrl)+'" target="_blank" rel="noopener" onclick="bump(\''+it.id+'\',\'copy\')">コピーを作成</a>';
  if(it.downloadUrl) acts+='<a class="btn ghost" href="'+esc(it.downloadUrl)+'" target="_blank" rel="noopener" onclick="bump(\''+it.id+'\',\'download\')">ダウンロード</a>';
  if(it.externalUrl) acts+='<a class="btn ghost" href="'+esc(it.externalUrl)+'" target="_blank" rel="noopener">外部リンク</a>';
  var metaBits=['公開日 '+esc(it.createdAt||'')];
  if(it.views)     metaBits.push('閲覧 '+fmt(it.views));
  if(it.copies)    metaBits.push('コピー '+fmt(it.copies));
  if(it.downloads) metaBits.push('DL '+fmt(it.downloads));
  document.getElementById('detailBody').innerHTML=
    img+'<span class="cat">'+esc(catLabel(it.category))+'</span><h2>'+esc(it.title)+'</h2>'+
    '<p style="color:var(--muted);margin:0">'+esc(it.summary)+'</p>'+
    (it.description?'<div class="desc">'+esc(it.description)+'</div>':'')+tags+
    '<div class="actions">'+acts+'</div>'+
    '<div class="meta">'+metaBits.join(' ・ ')+'</div>';
  openModal('ovDetail');
}

/* ===== コンタクト（誰でも） ===== */
function buildKindGrid(){
  STATE.contactKind=KINDS[0].key;
  document.getElementById('kindGrid').innerHTML=KINDS.map(function(k,i){
    return '<button class="kind'+(i===0?' active':'')+'" data-k="'+esc(k.key)+'" onclick="pickKind(\''+esc(k.key)+'\',this)">'+
      '<span class="k-emoji">'+k.emoji+'</span>'+
      '<span class="k-title">'+esc(k.title)+'</span>'+
      '<span class="k-sub">'+esc(k.sub)+'</span></button>';
  }).join('');
}
function pickKind(key,el){
  STATE.contactKind=key;
  document.querySelectorAll('#kindGrid .kind').forEach(function(b){b.classList.remove('active')});
  el.classList.add('active');
}
function openContact(){
  document.getElementById('contactForm').style.display='block';
  document.getElementById('contactThanks').style.display='none';
  document.getElementById('contactErr').textContent='';
  ['c_body','c_name','c_contact'].forEach(function(id){document.getElementById(id).value='';});
  buildKindGrid();
  openModal('ovContact');
  setTimeout(function(){document.getElementById('c_body').focus()},150);
}
function submitContact(){
  var body=document.getElementById('c_body').value.trim();
  if(!body){ document.getElementById('contactErr').textContent='内容を入力してください。'; return; }
  if(!GAS_URL){ document.getElementById('contactErr').textContent='送信先が未設定です。'; return; }
  var payload={
    action:'contact',
    kind:STATE.contactKind||'その他',
    body:body,
    name:document.getElementById('c_name').value.trim(),
    contact:document.getElementById('c_contact').value.trim()
  };
  var btn=document.getElementById('contactSend');
  btn.disabled=true; btn.textContent='送信中…';
  apiPost(payload).then(function(res){
    btn.disabled=false; btn.textContent='送信する';
    if(res&&res.ok){
      document.getElementById('contactForm').style.display='none';
      document.getElementById('contactThanks').style.display='block';
    }else{
      document.getElementById('contactErr').textContent='送信できませんでした：'+((res&&res.error)||'不明なエラー');
    }
  }).catch(function(e){
    btn.disabled=false; btn.textContent='送信する';
    document.getElementById('contactErr').textContent='送信できませんでした：'+e.message;
  });
}

/* ===== カウント（閲覧・コピー・DL）===== */
function bump(id,kind){
  kind=kind||'view';
  var it=STATE.items.find(function(x){return x.id===id});
  if(it){
    if(kind==='copy')          it.copies   =(it.copies   ||0)+1;
    else if(kind==='download') it.downloads=(it.downloads||0)+1;
    else                       it.views    =(it.views    ||0)+1;
    render();
  }
  try{ if(GAS_URL){ apiPost({action:'bump', id:id, kind:kind}).catch(function(){}); } }catch(e){}
}

/* ===== 雑多 ===== */
function showVisits(n){
  if(n==null) return;
  var el=document.getElementById('visits');
  el.innerHTML='これまで <b>'+fmt(n)+'</b> 回ひらかれました';
  el.style.display='block';
}
function fmt(n){ return Number(n||0).toLocaleString('ja-JP'); }
function openModal(id){ document.getElementById(id).classList.add('show'); document.body.style.overflow='hidden'; }
function closeModal(id){ document.getElementById(id).classList.remove('show'); document.body.style.overflow=''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }
function phraseWrap(s){
  s=String(s||'');
  var parts=s.replace(/。/g,'。\u0001').split('\u0001');
  return parts.filter(function(p){return p.length;}).map(function(p){
    var m=p.match(/^(.*?)(.[。、！？)）」』])$/);
    var inner = m
      ? esc(m[1])+'<span class="nobr">'+esc(m[2])+'</span>'
      : esc(p);
    return '<span class="phrase">'+inner+'</span>';
  }).join('');
}
function initial(t){ return esc((t||'?').trim().charAt(0)); }
</script>
