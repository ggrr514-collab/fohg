  ② 週報: 土曜授業がある週は土曜まで表示する

  どちらも「その日に授業(校時)が1つでも入っているか、給食が出るか」を

  そのままコピーしてください。<pre>や<style>や<script>などのタグを
  絶対に新しく追加しないでください（追加するとエラーになります）。
  ============================================================
-->

function rowHasClasses_(row) {
  if (!row) return false;
  const lunchCols = [EVENT_COL.LUNCH1, EVENT_COL.LUNCH2, EVENT_COL.LUNCH3];
  for (let i = 0; i < lunchCols.length; i++) {
    const v = String(row[lunchCols[i] - 1] || '').trim();
    if (v === '○' || v === '◯') return true;
  }
  const periodCols = [].concat(EVENT_COL.G1_PERIODS, EVENT_COL.G2_PERIODS, EVENT_COL.G3_PERIODS);
  for (let i = 0; i < periodCols.length; i++) {
    const v = row[periodCols[i] - 1];
    if (v !== null && v !== undefined && String(v).trim() !== '') return true;
  }
  return false;
}

function renderSchedule(sch) {
  sch = sch || { today: [], tomorrow: [] };
  renderScheduleList(sch.today || [], 'scheduleToday', 'today');
  renderScheduleList(sch.tomorrow || [], 'scheduleTomorrow', 'tomorrow');
  setScheduleDayOff('scheduleToday', sch.todayIsSchoolDay === false);
  setScheduleDayOff('scheduleTomorrow', sch.tomorrowIsSchoolDay === false);
}

function setScheduleDayOff(listId, isDayOff) {
  var ul = document.getElementById(listId);
  if (!ul) return;
  var box = ul.closest('.schedule-box');
  if (!box) return;
  box.classList.toggle('day-off', !!isDayOff);
  var label = box.querySelector('.label');
  if (!label) return;
  var badge = label.querySelector('.day-off-badge');
  if (isDayOff) {
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'day-off-badge';
      badge.textContent = ' 🌙 休業日';
      label.appendChild(badge);
    }
  } else if (badge) {
    badge.remove();
  }
}
